<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>하오하오</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light;--bg:#f2f2f2;--pn:#fff;--hd:#e9e9e9;--bd:#d6d6d6;--ink:#1a1a1a;--mu:#7a7a7a;--dk:#222;--ac:#222}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px 12px 40px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{border:0;background:#dcdcdc;color:var(--ink);padding:10px 24px;border-radius:10px 10px 0 0;font:inherit;cursor:pointer;width:auto}
.tab:hover{background:#cfcfcf}.tab.on{background:var(--dk);color:#fff}
.tab:disabled{opacity:.45;cursor:default}
.pn{background:var(--pn);border:1px solid var(--bd);padding:10px}
.hd{background:var(--hd);padding:4px 10px;font-size:13px;color:#444;margin-bottom:8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:230px 1fr;gap:10px}
.box{min-height:220px;max-height:300px;overflow:auto}
#us div{padding:2px 6px;font-size:14px}
.rm{display:grid;grid-template-columns:56px 1fr auto;gap:10px;border:1px solid var(--bd);padding:8px 12px;margin-bottom:8px;cursor:pointer;align-items:center}
.rm:hover{background:#f7f7f7}.rm.pl{background:#ececec;color:#555}
.rm .no{font-size:22px}.rm small{display:block;color:var(--mu)}.rm .st{text-align:right;font-size:13px}
#mkf{margin:0 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--dk);outline-offset:1px}
button.pr{background:var(--dk);color:#fff;border-color:var(--dk);cursor:pointer}
button:disabled{opacity:.45}
.info{background:var(--hd);padding:6px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stage{background-color:#f3f3f3;background-image:linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%),linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%);background-size:56px 56px;background-position:0 0,28px 28px;padding:16px 10px 12px;border-radius:6px}
.top{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
.board{width:min(100%,420px);background:#222;color:#fff;border-radius:18px;padding:10px 16px 14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.pw{letter-spacing:.35em;font-size:14px;color:#aaa;min-height:22px}.pw u{color:#fff;font-weight:700;text-decoration:none;border-bottom:2px solid #fff}
.tile{height:84px;display:grid;place-items:center;font:800 58px/1 "Noto Serif KR","Batang",serif}
.bar{position:relative;height:18px;background:#4a4a4a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#e6e6e6}
.bar b{position:absolute;right:8px;top:0;font-size:12px;line-height:18px;color:#fff;mix-blend-mode:difference}
.chain{width:92px;height:92px;border-radius:50%;background:#222;color:#fff;display:grid;place-content:center;text-align:center;line-height:1.1;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.chain small{font-size:12px;letter-spacing:.15em}.chain b{font-size:32px}
.hint{text-align:center;margin-top:12px;font-weight:700}.lw{text-align:center;color:#555;font-size:14px;min-height:21px}
.hs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px;min-height:30px}
.hs span{background:#222;color:#fff;border-radius:6px;padding:3px 12px;font-size:14px}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cd{width:112px;border:1px solid var(--bd);border-radius:10px;padding:10px 8px;text-align:center;background:#ececec;position:relative}
.cd b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cd i{position:absolute;top:6px;right:6px;font-style:normal;font-size:11px;background:var(--dk);color:#fff;border-radius:99px;padding:0 7px}
.av{width:54px;height:54px;border-radius:50% 50% 12px 12px;background:#c9c9c9;color:#555;margin:2px auto 6px;display:grid;place-items:center;font-weight:800;font-size:22px}
.cd.cur{background:#fff;border:2px solid #222;box-shadow:0 4px 12px rgba(0,0,0,.3);transform:translateY(-4px)}.cd.cur .av{background:#222;color:#fff}
.cd.out{opacity:.4;text-decoration:line-through}
#chat{margin-top:12px}
#log{height:170px;overflow:auto;font-size:14px}
.ln{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:2px 6px}
.ln .n{color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ln .ts{color:#aaa;font-size:12px}
.ln.a{background:#efefef}.ln.a .n{font-weight:700}.ln.g .m{font-weight:700}
form{display:flex;gap:8px;margin-top:8px}form input{flex:1}
#er{min-height:22px;color:#b00020;font-size:14px;padding:2px 4px}
#login{max-width:340px;margin:12vh auto;text-align:center}#login h1{font-size:34px;margin:0 0 4px}
#login input{width:100%;margin:12px 0 8px}#login button{width:100%}
@media(max-width:700px){.grid{grid-template-columns:1fr}.box{max-height:200px}}
</style></head><body><main>
<section id="login" class="pn"><h1>하오하오</h1><div class="mu" style="color:var(--mu)">친구들과 하는 끝말잇기</div>
<input id="nm" maxlength="8" placeholder="닉네임" autocomplete="off"><button class="pr" id="go">입장</button></section>
<div id="app" hidden>
<div id="er"></div>
<div id="lobby"><div class="tabs"><button class="tab" id="mk">방 만들기</button></div>
<div class="pn"><div id="mkf" hidden><input id="tt" maxlength="16" placeholder="방 제목"><select id="lm"><option value="10">10초</option><option value="15" selected>15초</option><option value="20">20초</option><option value="30">30초</option></select><button class="pr" id="mk2">만들기</button></div>
<div class="grid"><div><div class="hd"><span>접속자 목록 [<span id="uc">0</span>명]</span></div><div class="box" id="us"></div></div>
<div><div class="hd"><span>방 목록 [<span id="rc">0</span>개]</span></div><div class="box" id="rs"></div></div></div></div></div>
<div id="room" hidden><div class="tabs"><button class="tab on" id="st">시작</button><button class="tab" id="lv">나가기</button></div>
<div class="pn"><div class="info"><span id="ti"></span><span id="ri"></span></div>
<div class="stage"><div class="top"><div class="board"><div class="pw" id="pw">&nbsp;</div><div class="tile" id="tile">?</div><div class="bar"><i id="bi" style="width:0"></i><b id="sec"></b></div></div>
<div class="chain" id="chain" hidden><small>CHAIN</small><b id="cn">0</b></div></div>
<div class="hint" id="hint"></div><div class="lw" id="lw"></div><div class="hs" id="hs"></div><div class="cards" id="cs"></div></div></div></div>
<div id="chat" class="pn"><div class="hd"><span>채팅</span></div><div id="log"></div>
<form id="cf"><input id="ci" maxlength="100" autocomplete="off" placeholder="채팅"><button class="pr">전송</button></form></div>
</div>
<script>
const $=s=>document.querySelector(s),LD=['','']; let ws,S=null,dl=0,inRoom=false,erT;
const tx=(el,t)=>{el.textContent=t;return el};
const mk=(tag,cls,t)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(t!=null)e.textContent=t;return e};
const err=m=>{$('#er').textContent=m;clearTimeout(erT);erT=setTimeout(()=>$('#er').textContent='',3500)};
const out=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function view(r){inRoom=r;$('#lobby').hidden=r;$('#room').hidden=!r;$('#log').textContent='';S=null;$('#ci').placeholder='채팅'}
function line(m){const d=mk('div','ln '+m.k),log=$('#log');
 d.append(mk('span','n',m.k=='a'?'알림':m.k=='g'?'단어 · '+m.n:m.n),mk('span','m',m.m),mk('span','ts',new Date().toLocaleTimeString('ko-KR')));
 const bot=log.scrollTop+log.clientHeight>=log.scrollHeight-30;log.append(d);if(bot)log.scrollTop=log.scrollHeight}
function lobby(l){tx($('#uc'),l.us.length);tx($('#rc'),l.rs.length);
 $('#us').replaceChildren(...l.us.map(u=>mk('div','',u.name+(u.room?' (방 '+u.room+')':''))));
 $('#rs').replaceChildren(...l.rs.map(r=>{const d=mk('div','rm'+(r.play?' pl':''));d.onclick=()=>out({t:'jn',room:r.id});
  const i=mk('div');i.append(mk('b','',r.title),mk('small','','한국어 끝말잇기 · 제한 '+r.lim+'초'));
  d.append(mk('div','no',r.id),i,mk('div','st',r.n+' / '+r.max+'\n'+(r.play?'진행중':'대기')));d.lastChild.style.whiteSpace='pre';return d}))}
const nm=id=>{const p=S&&S.ps.find(p=>p.id==id);return p?p.name:''};
function room(s){S=s;dl=Date.now()+s.rem;const play=s.ph=='play',mine=play&&s.cur==s.you,me=s.host==s.you;
 tx($('#ti'),'['+s.id+'] '+s.title);tx($('#ri'),'한국어 끝말잇기 · 참여자 '+s.ps.length+' / 8 · 제한 '+s.lim+'초');
 $('#cs').replaceChildren(...s.ps.map(p=>{const d=mk('div','cd'+(play&&s.cur==p.id?' cur':'')+(p.alive?'':' out'));
  if(p.id==s.host)d.append(mk('i','','방장'));d.append(mk('div','av',p.name.slice(0,1)),mk('b','',p.name+(p.id==s.you?' (나)':'')));if(p.spec)d.append(mk('small','','관전'));return d}));
 $('#pw').replaceChildren(...(s.last?[document.createTextNode(s.last.slice(0,-1)),mk('u','',s.last.slice(-1))]:[document.createTextNode('\u00a0')]));
 tx($('#tile'),play?(s.last?s.last.slice(-1):'♪'):'?');
 $('#chain').hidden=!play&&s.ph!='end';tx($('#cn'),s.chain||0);
 $('#hs').replaceChildren(...(s.hist||[]).map((w,i)=>{const e=mk('span','',w);if(i)e.style.opacity='.6';return e}));
 tx($('#hint'),play?(mine?'내 차례! 단어를 입력해줘':nm(s.cur)+' 차례'):s.ph=='end'?'우승: '+(nm(s.win)||'없음'):'2명 이상 모이면 방장이 시작해');
 tx($('#lw'),play?(s.need.length?'「'+s.need.join(' / ')+'」(으)로 시작':'아무 단어로 시작'):'');
 const b=$('#st');b.disabled=play||!me;tx(b,play?'진행 중':me?'시작':'방장이 시작해');
 $('#ci').placeholder=mine?'단어 입력 (내 차례)':'채팅'}
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(!v)return;$('#ci').value='';
 if(inRoom&&S&&S.ph=='play'&&S.cur==S.you)out({t:'word',w:v});else out({t:'chat',m:v})};
$('#mk').onclick=()=>{$('#mkf').hidden=!$('#mkf').hidden};
$('#mk2').onclick=()=>{out({t:'mk',title:$('#tt').value,lim:$('#lm').value});$('#tt').value='';$('#mkf').hidden=true};
$('#st').onclick=()=>out({t:'start'});$('#lv').onclick=()=>out({t:'lv'});
function connect(){const n=$('#nm').value.trim();if(!n)return;$('#go').disabled=true;tx($('#go'),'연결 중... (처음엔 30초쯤 걸려)');
 ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>out({t:'hi',name:n});
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t=='ok'){$('#login').hidden=true;$('#app').hidden=false;view(false)}
  else if(m.t=='l'&&!inRoom)lobby(m);else if(m.t=='r')view(true);else if(m.t=='q')view(false);
  else if(m.t=='s')room(m);else if(m.t=='c')line(m);else if(m.t=='e'){if($('#app').hidden){$('#go').disabled=false;tx($('#go'),'입장')}err(m.m);if($('#app').hidden)alert(m.m)}};
 ws.onclose=()=>{if(!$('#app').hidden)err('연결이 끊겼어. 새로고침해줘.');else{$('#go').disabled=false;tx($('#go'),'입장')}}}
$('#go').onclick=connect;$('#nm').onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)connect()};
setInterval(()=>{if(S&&S.ph=='play'){const r=Math.max(0,dl-Date.now());$('#bi').style.width=Math.min(100,r/S.lim/10)+'%';tx($('#sec'),(r/1000).toFixed(1)+'초')}else if(S){$('#bi').style.width='0';tx($('#sec'),'')}},100);
</script></body></html>
